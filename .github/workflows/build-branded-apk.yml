# Build Android artifacts for direct testing and Google Play release
name: Build Branded Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-branded-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Download exact AaronzNetworking icon
        run: |
          curl --fail --location --retry 3 \
            https://scannerlive.aaronznetworking.net/downloads/Trisate-Scanner-Icon.png \
            -o /tmp/tristate-scanner-icon.png
          file /tmp/tristate-scanner-icon.png

      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert /tmp/tristate-scanner-icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Apply launcher icon to manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace(
                  '<application ',
                  '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" ',
                  1,
              )
          p.write_text(s)
          PY
          grep -n '<application' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tri-State-Scanner-App.apk

      - name: Upload branded APK
        uses: actions/upload-artifact@v4
        with:
          name: Tri-State-Scanner-Branded
          path: Tri-State-Scanner-App.apk

      - name: Restore Google Play signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tristate-release.jks"

      - name: Build signed Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tristate-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Rename Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cp app/build/outputs/bundle/release/app-release.aab Tri-State-Scanner-Google-Play.aab

      - name: Upload Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tri-State-Scanner-Google-Play
          path: Tri-State-Scanner-Google-Play.aab
