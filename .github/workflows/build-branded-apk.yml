# Build Android artifacts for direct testing and Google Play release (signed AAB enabled)
name: Build Branded Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-branded-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Verify Scannerz Network icon
        run: |
          test -f app/Scannerz-Network-Icon.png
          file app/Scannerz-Network-Icon.png

      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Apply compact talkgroup list display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt')
          s = p.read_text()

          old_data = '''    private data class TalkgroupOption(
                  val id: Int,
                  val name: String,
                  val agency: String
              )'''
          new_data = '''    private data class TalkgroupOption(
                  val id: Int,
                  val name: String,
                  val talkgroupIds: String
              )'''

          old_load = '''            val agency = if (tg.isNull("agency")) {
                          ""
                      } else {
                          tg.optString("agency", "")
                      }

                      incoming.add(
                          TalkgroupOption(
                              id = id,
                              name = tg.optString("name", "Talkgroup $id"),
                              agency = agency
                          )
                      )'''
          new_load = '''            val talkgroupIds = tg.optString("talkgroup_ids", id.toString())
                          .trim()
                          .ifBlank { id.toString() }

                      incoming.add(
                          TalkgroupOption(
                              id = id,
                              name = tg.optString("name", "Talkgroup $id"),
                              talkgroupIds = talkgroupIds
                          )
                      )'''

          old_labels = '''        val labels = talkgroups.map { tg ->
                      if (tg.agency.isBlank()) {
                          "${tg.name} (TG ${tg.id})"
                      } else {
                          "${tg.name} (TG ${tg.id})\\n${tg.agency}"
                      }
                  }.toTypedArray()'''
          new_labels = '''        val labels = talkgroups.map { tg ->
                      val prefix = if (tg.talkgroupIds.contains(",")) "TGIDs" else "TGID"
                      "${tg.name} • $prefix ${tg.talkgroupIds}"
                  }.toTypedArray()'''

          for label, old, new in [
              ('TalkgroupOption', old_data, new_data),
              ('loadTalkgroups', old_load, new_load),
              ('dialog labels', old_labels, new_labels),
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {label} block; found {s.count(old)}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          print('Compact talkgroup display applied')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Scannerz-Network-App.apk

      - name: Upload branded APK
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-Branded
          path: Scannerz-Network-App.apk

      - name: Restore Google Play signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scannerz-network-release.jks"

      - name: Build signed Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/scannerz-network-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Rename Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cp app/build/outputs/bundle/release/app-release.aab Scannerz-Network-Google-Play.aab

      - name: Upload Google Play AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-Google-Play
          path: Scannerz-Network-Google-Play.aab
