name: Apply Scannerz 0.2.13

on:
  push:
    paths:
      - 'tools/apply_0213.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply source update
        run: python3 tools/apply_0213.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/res/layout/activity_main.xml app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Apply Scannerz Network 0.2.13 multi-feed weather update"
            git push
          fi
