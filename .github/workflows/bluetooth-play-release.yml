name: Bluetooth Google Play Release

on:
  workflow_dispatch:
  push:
    branches:
      - bluetooth-compat-v1.0.2
      - bluetooth-padding-v1.0.4
    paths:
      - 'app/**'
      - '.github/workflows/bluetooth-play-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Restore existing Google Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scannerz-network-release.jks"
      - name: Build signed release AAB and APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/scannerz-network-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-v1.0.4-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-v1.0.4-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
