name: Apply 0.2.12 NWS Exclusive Update

on:
  push:
    paths:
      - '.github/workflows/apply-0.2.12-nws-exclusive.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Android 0.2.12 NWS isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt')
          s = p.read_text()

          # Replace the talkgroup dialog so manual NWS is exclusive,
          # deselecting NWS restores prior choices, and Enable All leaves
          # NWS disabled in normal scanner mode.
          start_marker = '    private fun showTalkgroupDialog() {'
          end_marker = '    private fun pushListenerPreferences()'
          start = s.find(start_marker)
          end = s.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit('ERROR: could not locate showTalkgroupDialog section')

          new = '''    private fun showTalkgroupDialog() {
              if (talkgroups.isEmpty()) {
                  AlertDialog.Builder(this)
                      .setTitle("Talkgroups")
                      .setMessage("No talkgroups are currently available.")
                      .setPositiveButton("OK", null)
                      .show()
                  return
              }

              val labels = talkgroups.map { tg ->
                  val prefix = if (tg.talkgroupIds.contains(',')) "TGIDs" else "TGID"
                  "$prefix ${tg.talkgroupIds} • ${tg.name}"
              }.toTypedArray()

              val checked = BooleanArray(talkgroups.size) { index ->
                  talkgroups[index].id !in blockedTalkgroups
              }

              val nwsId = WeatherTakeoverConfig.NWS_TALKGROUP.toIntOrNull()
              val nwsIndex = talkgroups.indexOfFirst { option ->
                  nwsId != null && nwsId in option.allIds
              }

              var preNwsChecked: BooleanArray? = null

              if (nwsIndex >= 0 && checked[nwsIndex]) {
                  val savedEnabled = prefs.getStringSet(
                      "pre_nws_enabled_talkgroups",
                      emptySet()
                  ).orEmpty().mapNotNull { it.toIntOrNull() }.toSet()

                  if (savedEnabled.isNotEmpty()) {
                      preNwsChecked = BooleanArray(talkgroups.size) { index ->
                          talkgroups[index].id in savedEnabled
                      }
                  }

                  for (i in checked.indices) {
                      checked[i] = i == nwsIndex
                  }
              }

              lateinit var dialog: AlertDialog

              dialog = AlertDialog.Builder(this)
                  .setTitle("Choose Talkgroups")
                  .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                      if (nwsIndex >= 0 && which == nwsIndex) {
                          if (isChecked) {
                              preNwsChecked = checked.copyOf().also {
                                  it[nwsIndex] = false
                              }

                              val enabledBeforeNws = mutableSetOf<String>()
                              preNwsChecked?.forEachIndexed { index, enabled ->
                                  if (enabled) {
                                      enabledBeforeNws.add(talkgroups[index].id.toString())
                                  }
                              }

                              prefs.edit()
                                  .putStringSet("pre_nws_enabled_talkgroups", enabledBeforeNws)
                                  .apply()

                              for (i in checked.indices) {
                                  checked[i] = i == nwsIndex
                                  dialog.listView.setItemChecked(i, checked[i])
                              }
                          } else {
                              val restore = preNwsChecked
                              if (restore != null) {
                                  for (i in checked.indices) {
                                      checked[i] = restore[i]
                                      dialog.listView.setItemChecked(i, checked[i])
                                  }
                              } else {
                                  for (i in checked.indices) {
                                      checked[i] = i != nwsIndex
                                      dialog.listView.setItemChecked(i, checked[i])
                                  }
                              }

                              prefs.edit()
                                  .remove("pre_nws_enabled_talkgroups")
                                  .apply()
                          }
                      } else {
                          checked[which] = isChecked

                          if (nwsIndex >= 0 && isChecked && checked[nwsIndex]) {
                              val restore = preNwsChecked
                              if (restore != null) {
                                  for (i in checked.indices) {
                                      checked[i] = restore[i]
                                      dialog.listView.setItemChecked(i, checked[i])
                                  }
                                  checked[which] = true
                                  dialog.listView.setItemChecked(which, true)
                              }
                              checked[nwsIndex] = false
                              dialog.listView.setItemChecked(nwsIndex, false)
                              prefs.edit()
                                  .remove("pre_nws_enabled_talkgroups")
                                  .apply()
                          }
                      }
                  }
                  .setPositiveButton("Save") { _, _ ->
                      blockedTalkgroups.clear()
                      for (i in talkgroups.indices) {
                          if (!checked[i]) blockedTalkgroups.add(talkgroups[i].id)
                      }
                      saveBlockedTalkgroups()
                      updateTalkgroupButton()
                      scope.launch(Dispatchers.IO) { pushListenerPreferences() }

                      if (running) {
                          scope.launch {
                              restartScannerAtLiveEdge(
                                  if (nwsIndex >= 0 && checked[nwsIndex]) {
                                      "Weather Radio selected — listening to NWS only…"
                                  } else {
                                      "Talkgroup choices updated — returning to live calls…"
                                  }
                              )
                          }
                      }
                  }
                  .setNeutralButton("Enable All") { _, _ ->
                      blockedTalkgroups.clear()
                      if (nwsIndex >= 0) {
                          blockedTalkgroups.add(talkgroups[nwsIndex].id)
                      }
                      prefs.edit().remove("pre_nws_enabled_talkgroups").apply()
                      saveBlockedTalkgroups()
                      updateTalkgroupButton()
                      scope.launch(Dispatchers.IO) { pushListenerPreferences() }
                      if (running) {
                          scope.launch {
                              restartScannerAtLiveEdge(
                                  "All normal talkgroups enabled — returning to live calls…"
                              )
                          }
                      }
                  }
                  .setNegativeButton("Cancel", null)
                  .create()

              dialog.show()
          }

'''

          s = s[:start] + new + s[end:]

          # Hard isolation: TG 5500 can only enter ordinary scanner playback
          # when the listener has intentionally selected NWS as the exclusive
          # manual talkgroup. Automatic weather takeover uses its own path.
          old = '''            val tg = call.optString("talkgroup").toIntOrNull()
            if (tg != null && isTalkgroupBlocked(tg)) continue

            playCallAndWait(call, generation)'''

          new_poll = '''            val tg = call.optString("talkgroup").toIntOrNull()
            if (tg != null) {
                val nwsId = WeatherTakeoverConfig.NWS_TALKGROUP.toIntOrNull()
                val nwsOption = if (nwsId != null) {
                    talkgroups.firstOrNull { nwsId in it.allIds }
                } else {
                    null
                }

                val manualNwsExclusive =
                    nwsOption != null &&
                    nwsOption.id !in blockedTalkgroups &&
                    talkgroups
                        .filter { it.id != nwsOption.id }
                        .all { it.id in blockedTalkgroups }

                if (
                    nwsId != null &&
                    tg == nwsId &&
                    !manualNwsExclusive
                ) {
                    continue
                }

                if (isTalkgroupBlocked(tg)) continue
            }

            playCallAndWait(call, generation)'''

          if old not in s:
              raise SystemExit('ERROR: could not locate pollCalls TG filter block')

          s = s.replace(old, new_poll, 1)
          p.write_text(s)

          print('Applied final 0.2.12 NWS exclusive + normal queue isolation behavior')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m "Finalize Scannerz Network 0.2.12 NWS isolation"
          git push
