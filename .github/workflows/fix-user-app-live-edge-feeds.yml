name: Fix User App Live Edge and Feed Refresh

on:
  push:
    paths:
      - 'tools/fix_user_app_live_edge_feeds.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply live edge and feed refresh fixes
        run: python3 tools/fix_user_app_live_edge_feeds.py

      - name: Commit fixed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Fix user app live edge and automatic feed refresh"
            git push
          fi

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate launcher icons
        shell: bash
        run: |
          set -euo pipefail
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Restore release signing keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scannerz-network-release.jks"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/scannerz-network-release.jks
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Rename release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Scannerz-Network-v0.2.16-Code18.apk
          cp app/build/outputs/bundle/release/app-release.aab Scannerz-Network-v0.2.16-Code18.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-v0.2.16-Code18-APK
          path: Scannerz-Network-v0.2.16-Code18.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-v0.2.16-Code18-AAB
          path: Scannerz-Network-v0.2.16-Code18.aab
