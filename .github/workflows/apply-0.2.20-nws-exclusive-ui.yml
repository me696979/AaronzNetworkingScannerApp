name: Apply Android 0.2.20 NWS Exclusive Selector Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-0.2.20-nws-exclusive-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply NWS exclusive talkgroup selector fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt')
          gradle = Path('app/build.gradle.kts')
          s = main.read_text()

          marker = '    private val blockedTalkgroups = mutableSetOf<String>()\n'
          if 'private var manualNwsActive = false' not in s:
              if marker not in s:
                  raise SystemExit('blockedTalkgroups marker not found')
              s = s.replace(
                  marker,
                  marker +
                  '    private var manualNwsActive = false\n' +
                  '    private var preNwsBlockedTalkgroups: Set<String>? = null\n',
                  1
              )

          start = s.find('    private fun showTalkgroupDialog() {')
          end = s.find('    private fun pushListenerPreferences()', start)
          if start < 0 or end < 0:
              raise SystemExit('showTalkgroupDialog block not found')

          replacement = r'''    private fun showTalkgroupDialog() {
        if (talkgroups.isEmpty()) {
            AlertDialog.Builder(this)
                .setTitle("Talkgroups")
                .setMessage("No talkgroups are currently available.")
                .setPositiveButton("OK", null)
                .show()
            return
        }

        val labels = talkgroups.map { tg ->
            val prefix = if (tg.talkgroupIds.contains(',')) "TGIDs" else "TGID"
            "$prefix ${tg.talkgroupIds} • ${tg.name}"
        }.toTypedArray()

        val nwsRawId = weatherRadioTalkgroup
            ?.trim()
            ?.toIntOrNull()

        val nwsIndex = talkgroups.indexOfFirst { tg ->
            nwsRawId != null && nwsRawId in tg.allIds
        }

        val checked = BooleanArray(talkgroups.size) { index ->
            if (manualNwsActive && nwsIndex >= 0) {
                index == nwsIndex
            } else {
                talkgroups[index].selectionKey !in blockedTalkgroups
            }
        }

        lateinit var dialog: AlertDialog

        fun repaint() {
            for (i in checked.indices) {
                dialog.listView.setItemChecked(i, checked[i])
            }
        }

        fun syncPreferences(message: String, saveNormal: Boolean) {
            if (saveNormal) {
                saveBlockedTalkgroups()
            }
            updateTalkgroupButton()
            scope.launch(Dispatchers.IO) { pushListenerPreferences() }
            if (running) {
                scope.launch { restartScannerAtLiveEdge(message) }
            }
        }

        dialog = AlertDialog.Builder(this)
            .setTitle("Choose Talkgroups")
            .setMultiChoiceItems(labels, checked) { _, which, isChecked ->
                if (nwsIndex >= 0 && which == nwsIndex) {
                    if (isChecked) {
                        if (!manualNwsActive) {
                            preNwsBlockedTalkgroups = blockedTalkgroups.toSet()
                        }

                        manualNwsActive = true
                        blockedTalkgroups.clear()

                        for (i in talkgroups.indices) {
                            checked[i] = i == nwsIndex
                            if (i != nwsIndex) {
                                blockedTalkgroups.add(talkgroups[i].selectionKey)
                            }
                        }

                        repaint()
                        syncPreferences(
                            "NWS Weather Radio selected — normal talkgroups paused…",
                            saveNormal = false
                        )
                    } else {
                        manualNwsActive = false
                        blockedTalkgroups.clear()

                        preNwsBlockedTalkgroups?.let {
                            blockedTalkgroups.addAll(it)
                        } ?: loadSavedBlockedTalkgroups()

                        preNwsBlockedTalkgroups = null

                        // NWS is opt-in only during normal scanner mode.
                        blockedTalkgroups.add(talkgroups[nwsIndex].selectionKey)

                        for (i in talkgroups.indices) {
                            checked[i] = talkgroups[i].selectionKey !in blockedTalkgroups
                        }

                        repaint()
                        syncPreferences(
                            "Returning to normal scanner talkgroups…",
                            saveNormal = true
                        )
                    }
                } else {
                    // Changing a normal TG while NWS is active exits NWS first.
                    if (manualNwsActive) {
                        manualNwsActive = false
                        blockedTalkgroups.clear()
                        preNwsBlockedTalkgroups?.let {
                            blockedTalkgroups.addAll(it)
                        } ?: loadSavedBlockedTalkgroups()
                        preNwsBlockedTalkgroups = null

                        if (nwsIndex >= 0) {
                            blockedTalkgroups.add(talkgroups[nwsIndex].selectionKey)
                        }
                    }

                    val key = talkgroups[which].selectionKey
                    if (isChecked) {
                        blockedTalkgroups.remove(key)
                    } else {
                        blockedTalkgroups.add(key)
                    }

                    for (i in talkgroups.indices) {
                        checked[i] = talkgroups[i].selectionKey !in blockedTalkgroups
                    }

                    repaint()
                    syncPreferences(
                        "Talkgroup choices updated — returning to live calls…",
                        saveNormal = true
                    )
                }
            }
            .setNeutralButton("Enable All Normal") { _, _ ->
                manualNwsActive = false
                preNwsBlockedTalkgroups = null
                blockedTalkgroups.clear()

                if (nwsIndex >= 0) {
                    blockedTalkgroups.add(talkgroups[nwsIndex].selectionKey)
                }

                saveBlockedTalkgroups()
                updateTalkgroupButton()
                scope.launch(Dispatchers.IO) { pushListenerPreferences() }
                if (running) {
                    scope.launch {
                        restartScannerAtLiveEdge(
                            "All normal talkgroups enabled — returning to live calls…"
                        )
                    }
                }
            }
            .setNegativeButton("Done", null)
            .create()

        dialog.show()
    }

'''
          s = s[:start] + replacement + s[end:]

          # Keep NWS exclusive if the server refreshes the TG list while NWS is active.
          old = '''        talkgroups.clear()
        talkgroups.addAll(incoming)

        val legacyBlocked = blockedTalkgroups
'''
          new = '''        talkgroups.clear()
        talkgroups.addAll(incoming)

        val currentNwsRawId = weatherRadioTalkgroup
            ?.trim()
            ?.toIntOrNull()
        val currentNwsOption = incoming.firstOrNull { option ->
            currentNwsRawId != null && currentNwsRawId in option.allIds
        }

        if (manualNwsActive) {
            if (currentNwsOption != null) {
                blockedTalkgroups.clear()
                incoming
                    .filter { it.selectionKey != currentNwsOption.selectionKey }
                    .forEach { blockedTalkgroups.add(it.selectionKey) }
            } else {
                manualNwsActive = false
                preNwsBlockedTalkgroups = null
                loadSavedBlockedTalkgroups()
            }
        } else if (currentNwsOption != null) {
            blockedTalkgroups.add(currentNwsOption.selectionKey)
        }

        val legacyBlocked = blockedTalkgroups
'''
          if old not in s:
              raise SystemExit('loadTalkgroups insertion point not found')
          s = s.replace(old, new, 1)

          old_feed = '            applySelectedFeed(feeds[which]); talkgroups.clear(); blockedTalkgroups.clear(); loadSavedBlockedTalkgroups()\n'
          new_feed = '            manualNwsActive = false; preNwsBlockedTalkgroups = null; applySelectedFeed(feeds[which]); talkgroups.clear(); blockedTalkgroups.clear(); loadSavedBlockedTalkgroups()\n'
          if old_feed in s:
              s = s.replace(old_feed, new_feed, 1)

          main.write_text(s)

          g = gradle.read_text()
          g = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 22', g, count=1)
          g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.2.20"', g, count=1)
          gradle.write_text(g)

          check = main.read_text()
          required = [
              'private var manualNwsActive = false',
              'preNwsBlockedTalkgroups',
              'NWS Weather Radio selected — normal talkgroups paused',
              'checked[i] = i == nwsIndex',
              'currentNwsOption',
          ]
          for item in required:
              if item not in check:
                  raise SystemExit(f'missing validation marker: {item}')

          if 'versionCode = 22' not in gradle.read_text() or 'versionName = "0.2.20"' not in gradle.read_text():
              raise SystemExit('version bump failed')

          print('Android 0.2.20 NWS exclusive selector patch validated')
          PY

      - name: Commit source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Fix Android NWS exclusive talkgroup selection in 0.2.20"
            git push
          fi

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Scannerz Network launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Scannerz-Network-Icon.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Restore release signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scannerz-network-release.jks"

      - name: Build signed release APK and Google Play AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/scannerz-network-release.jks
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Rename release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Scannerz-Network-0.2.20.apk
          cp app/build/outputs/bundle/release/app-release.aab Scannerz-Network-0.2.20-Google-Play.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-0.2.20-APK
          path: Scannerz-Network-0.2.20.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-0.2.20-Google-Play
          path: Scannerz-Network-0.2.20-Google-Play.aab
