name: Bluetooth Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - bluetooth-compat-v1.0.1
    paths:
      - 'app/**'
      - '.github/workflows/bluetooth-test-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Bluetooth-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

