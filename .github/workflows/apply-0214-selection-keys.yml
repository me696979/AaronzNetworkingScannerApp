name: Apply and Build Scannerz 0.2.14 Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_0214_selection_keys.py'
      - '.github/workflows/apply-0214-selection-keys.yml'

permissions:
  contents: write

jobs:
  update-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply 0.2.14 final source fixes
        run: python3 tools/apply_0214_selection_keys.py

      - name: Commit final 0.2.14 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Scannerz 0.2.14 live-edge and talkgroup key fixes"
            git push
          fi

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate Scannerz Network launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Scannerz-Network-Icon.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Scannerz-Network-0.2.14.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-0.2.14-debug
          path: Scannerz-Network-0.2.14.apk

      - name: Restore Google Play signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scannerz-network-release.jks"

      - name: Build signed Google Play AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/scannerz-network-release.jks
        run: gradle bundleRelease --stacktrace

      - name: Rename Google Play AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: cp app/build/outputs/bundle/release/app-release.aab Scannerz-Network-0.2.14-Google-Play.aab

      - name: Upload Google Play AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Scannerz-Network-0.2.14-Google-Play
          path: Scannerz-Network-0.2.14-Google-Play.aab
