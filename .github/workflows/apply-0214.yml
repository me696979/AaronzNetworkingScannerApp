name: Apply Scannerz 0.2.14

on:
  push:
    paths:
      - 'tools/apply_0214.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Apply source update
        run: python3 tools/apply_0214.py

      - name: Generate Scannerz Network launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -f app/Scannerz-Network-Icon.png
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert app/Scannerz-Network-Icon.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/net/aaronznetworking/scanner/MainActivity.kt
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Fix Scannerz 0.2.14 startup backlog playback"
            git push
          fi
