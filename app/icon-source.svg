<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07110b"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ff31"/>
      <stop offset="1" stop-color="#58b900"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9c9c9"/>
      <stop offset="1" stop-color="#737373"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="hex" width="36" height="31" patternUnits="userSpaceOnUse">
      <path d="M9 1h18l8 14.5L27 30H9L1 15.5Z" fill="none" stroke="#18351e" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>

  <rect x="16" y="16" width="992" height="992" rx="150" fill="#0a0d0b" stroke="#222" stroke-width="18"/>
  <rect x="40" y="40" width="944" height="944" rx="126" fill="url(#bg)" stroke="#89ee19" stroke-width="6"/>
  <rect x="48" y="48" width="928" height="928" rx="118" fill="url(#hex)" opacity=".8"/>

  <text x="512" y="112" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="61" font-weight="700" letter-spacing="2">
    <tspan fill="url(#green)">AARONZ</tspan><tspan fill="url(#silver)">NETWORKING</tspan>
  </text>
  <line x1="152" y1="138" x2="872" y2="138" stroke="#91f21d" stroke-width="4" filter="url(#glow)"/>

  <!-- radio waves -->
  <g fill="none" stroke="#91f21d" stroke-width="16" stroke-linecap="round" filter="url(#glow)">
    <path d="M210 218 Q126 342 210 466"/>
    <path d="M265 246 Q205 342 265 438"/>
    <path d="M814 218 Q898 342 814 466"/>
    <path d="M759 246 Q819 342 759 438"/>
  </g>

  <!-- tri-state / WV centerpiece -->
  <path d="M394 215 L438 188 L481 203 L504 174 L530 211 L584 205 L611 228 L662 225 L674 260 L704 275 L684 313 L710 340 L684 369 L645 369 L618 401 L576 388 L552 414 L514 399 L474 416 L447 388 L410 393 L389 361 L355 349 L365 315 L344 286 L374 264 Z"
        fill="#0b170e" stroke="#9af223" stroke-width="8" filter="url(#glow)"/>
  <text x="526" y="320" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="84" font-weight="800" fill="url(#green)">WV</text>

  <!-- tower -->
  <g stroke="#9af223" fill="none" stroke-width="10" filter="url(#glow)">
    <circle cx="512" cy="379" r="13" fill="#c8ff37"/>
    <path d="M512 392 L452 542 M512 392 L572 542 M476 482 H548 M466 512 H558 M482 450 H542"/>
    <path d="M476 482 L548 482 L487 430 L537 430 L466 512 L558 512" stroke-width="6"/>
  </g>

  <path d="M66 555 Q512 470 958 555" fill="#061008" stroke="#75d51a" stroke-width="5" filter="url(#glow)"/>

  <text x="512" y="690" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="118" font-weight="900" letter-spacing="2" fill="url(#silver)" stroke="#eeeeee" stroke-width="1">TRI-STATE</text>
  <text x="512" y="814" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="132" font-weight="900" letter-spacing="1" fill="url(#green)" stroke="#b9ff38" stroke-width="2" filter="url(#glow)">SCANNER</text>

  <!-- pulse line -->
  <path d="M150 850 H445 L472 850 L486 830 L500 876 L516 818 L532 868 L548 844 L570 850 H874" fill="none" stroke="#8fe81b" stroke-width="6"/>

  <!-- bottom service labels -->
  <g font-family="DejaVu Sans,Arial,sans-serif" font-size="39" font-weight="700" text-anchor="middle">
    <text x="190" y="925" fill="#e7eef8">POLICE</text>
    <text x="410" y="925" fill="#ff7351">FIRE</text>
    <text x="610" y="925" fill="#b6ff34">EMS</text>
    <text x="825" y="925" fill="#eeeeee">WEATHER</text>
  </g>
  <g fill="#83dc17">
    <circle cx="300" cy="912" r="6"/><circle cx="510" cy="912" r="6"/><circle cx="716" cy="912" r="6"/>
  </g>
</svg>
