name: TriStateScanner
options:
  bundleIdPrefix: net.aaronznetworking
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TriStateScanner:
    type: application
    platform: iOS
    sources:
      - path: TriStateScanner
        excludes:
          - Resources
          - Info.plist
    resources:
      - path: TriStateScanner/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.aaronznetworking.scanner.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TriStateScanner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
